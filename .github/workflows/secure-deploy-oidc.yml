name: Secure Deploy with OIDC

on:
  push:
    branches: [main, develop]
    paths:
      - 'functions/**'
      - 'shared/**'
      - 'infrastructure/**'
      - '.github/workflows/secure-deploy-oidc.yml'
  pull_request:
    branches: [main]
    paths:
      - 'functions/**'
      - 'shared/**'
      - 'infrastructure/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  AWS_REGION: us-east-1
  GO_VERSION: '1.21'
  NODE_VERSION: '20'

# Required for OIDC authentication
permissions:
  id-token: write   # Required for OIDC token generation
  contents: read    # Required for checkout

jobs:
  # OIDC Authentication verification
  verify-oidc-auth:
    runs-on: ubuntu-latest
    outputs:
      aws-account-id: ${{ steps.verify-auth.outputs.aws-account-id }}
      caller-identity: ${{ steps.verify-auth.outputs.caller-identity }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOYMENT_ROLE_ARN }}
          role-session-name: GitHubActions-ServerlessCRUD-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          # Ensure credentials expire within 1 hour
          role-duration-seconds: 3600
        
      - name: Verify OIDC authentication
        id: verify-auth
        run: |
          echo "🔐 Verifying OIDC authentication..."
          
          # Get caller identity to verify authentication
          CALLER_IDENTITY=$(aws sts get-caller-identity)
          echo "Caller Identity: $CALLER_IDENTITY"
          
          # Extract AWS Account ID
          AWS_ACCOUNT_ID=$(echo "$CALLER_IDENTITY" | jq -r '.Account')
          echo "AWS Account ID: $AWS_ACCOUNT_ID"
          
          # Extract assumed role ARN to verify OIDC role assumption
          ASSUMED_ROLE_ARN=$(echo "$CALLER_IDENTITY" | jq -r '.Arn')
          echo "Assumed Role ARN: $ASSUMED_ROLE_ARN"
          
          # Verify this is an assumed role (not IAM user)
          if [[ "$ASSUMED_ROLE_ARN" != *"assumed-role"* ]]; then
            echo "❌ OIDC authentication failed - not using assumed role"
            echo "Expected assumed-role ARN, got: $ASSUMED_ROLE_ARN"
            exit 1
          fi
          
          # Verify role name contains expected pattern
          if [[ "$ASSUMED_ROLE_ARN" != *"GitHubActions"* ]] && [[ "$ASSUMED_ROLE_ARN" != *"ServerlessCRUD"* ]]; then
            echo "⚠️ Warning: Role name doesn't match expected pattern"
            echo "Role ARN: $ASSUMED_ROLE_ARN"
          fi
          
          # Check credential expiry (should be within 1 hour)
          TOKEN_EXPIRY=$(aws sts get-session-token --query 'Credentials.Expiration' --output text 2>/dev/null || echo "N/A")
          echo "Token Expiry: $TOKEN_EXPIRY"
          
          echo "✅ OIDC authentication successful"
          echo "aws-account-id=$AWS_ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "caller-identity=$CALLER_IDENTITY" >> $GITHUB_OUTPUT
      
      - name: Test AWS permissions
        run: |
          echo "🧪 Testing AWS permissions..."
          
          # Test CloudFormation permissions
          echo "Testing CloudFormation list-stacks permission..."
          aws cloudformation list-stacks --stack-status-filter CREATE_COMPLETE UPDATE_COMPLETE --max-items 1 > /dev/null
          echo "✅ CloudFormation permissions verified"
          
          # Test S3 permissions (for SAM artifacts)
          echo "Testing S3 list-buckets permission..."
          aws s3 ls > /dev/null || echo "⚠️ S3 permissions may be limited"
          
          # Test Lambda permissions
          echo "Testing Lambda list-functions permission..."
          aws lambda list-functions --max-items 1 > /dev/null || echo "⚠️ Lambda permissions may be limited"
          
          echo "✅ Basic AWS permissions verified"

  # Detect changes to determine build strategy
  detect-changes:
    runs-on: ubuntu-latest
    needs: verify-oidc-auth
    outputs:
      create-item: ${{ steps.changes.outputs.create-item }}
      get-item: ${{ steps.changes.outputs.get-item }}
      update-item: ${{ steps.changes.outputs.update-item }}
      delete-item: ${{ steps.changes.outputs.delete-item }}
      shared: ${{ steps.changes.outputs.shared }}
      infrastructure: ${{ steps.changes.outputs.infrastructure }}
      any-changes: ${{ steps.changes.outputs.any-changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for accurate change detection
      
      - uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            create-item:
              - 'functions/create-item/**'
            get-item:
              - 'functions/get-item/**'
            update-item:
              - 'functions/update-item/**'
            delete-item:
              - 'functions/delete-item/**'
            shared:
              - 'shared/**'
            infrastructure:
              - 'infrastructure/**'
            any-changes:
              - 'functions/**'
              - 'shared/**'
              - 'infrastructure/**'

  # Security scanning before build
  security-scan:
    runs-on: ubuntu-latest
    needs: [verify-oidc-auth, detect-changes]
    if: needs.detect-changes.outputs.any-changes == 'true'
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
      
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
      
      - name: Check for secrets in code
        run: |
          echo "🔍 Scanning for potential secrets..."
          
          # Check for common secret patterns
          if grep -r -i "aws_access_key\|aws_secret\|password\|token\|api_key" . \
             --exclude-dir=.git \
             --exclude-dir=node_modules \
             --exclude="*.yml" \
             --exclude="*.yaml" \
             --exclude="*.md"; then
            echo "❌ Potential secrets found in code"
            exit 1
          fi
          
          echo "✅ No secrets detected in code"

  # Build and test Go functions with security checks
  build-go-functions:
    runs-on: ubuntu-latest
    needs: [verify-oidc-auth, detect-changes, security-scan]
    if: needs.detect-changes.outputs.create-item == 'true' || needs.detect-changes.outputs.delete-item == 'true' || needs.detect-changes.outputs.shared == 'true'
    strategy:
      matrix:
        function: [create-item, delete-item]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
      
      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('functions/${{ matrix.function }}/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      
      - name: Install dependencies and security tools
        working-directory: functions/${{ matrix.function }}
        run: |
          go mod tidy
          go install github.com/securecodewarrior/gosec/v2/cmd/gosec@latest
          go install honnef.co/go/tools/cmd/staticcheck@latest
      
      - name: Run security scan with gosec
        working-directory: functions/${{ matrix.function }}
        run: |
          echo "🔒 Running Go security scan..."
          gosec -fmt json -out gosec-report.json ./... || true
          
          # Check for high severity issues
          if [ -f gosec-report.json ]; then
            HIGH_ISSUES=$(jq '.Issues | map(select(.severity == "HIGH")) | length' gosec-report.json)
            if [ "$HIGH_ISSUES" -gt 0 ]; then
              echo "❌ Found $HIGH_ISSUES high severity security issues"
              jq '.Issues | map(select(.severity == "HIGH"))' gosec-report.json
              exit 1
            fi
          fi
          
          echo "✅ Go security scan passed"
      
      - name: Run static analysis
        working-directory: functions/${{ matrix.function }}
        run: |
          echo "🔍 Running static analysis..."
          go vet ./...
          staticcheck ./...
          echo "✅ Static analysis passed"
      
      - name: Run tests with coverage
        working-directory: functions/${{ matrix.function }}
        run: |
          echo "🧪 Running Go tests..."
          go test -v -race -coverprofile=coverage.out ./...
          
          # Check coverage threshold
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Test coverage: $COVERAGE%"
          
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "❌ Test coverage ($COVERAGE%) is below 80% threshold"
            exit 1
          fi
          
          echo "✅ Go tests passed with $COVERAGE% coverage"
      
      - name: Build function for deployment
        working-directory: functions/${{ matrix.function }}
        run: |
          echo "🔨 Building Go function..."
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o bootstrap main.go logger.go
          
          # Verify binary was created
          if [ ! -f bootstrap ]; then
            echo "❌ Failed to build Go binary"
            exit 1
          fi
          
          # Check binary size (should be reasonable)
          BINARY_SIZE=$(stat -f%z bootstrap 2>/dev/null || stat -c%s bootstrap)
          echo "Binary size: $BINARY_SIZE bytes"
          
          if [ "$BINARY_SIZE" -gt 50000000 ]; then  # 50MB limit
            echo "⚠️ Binary size is quite large: $BINARY_SIZE bytes"
          fi
          
          echo "✅ Go function built successfully"
      
      - name: Upload Go artifacts
        uses: actions/upload-artifact@v3
        with:
          name: go-function-${{ matrix.function }}
          path: functions/${{ matrix.function }}/bootstrap
          retention-days: 1

  # Build and test Node.js functions with security checks
  build-node-functions:
    runs-on: ubuntu-latest
    needs: [verify-oidc-auth, detect-changes, security-scan]
    if: needs.detect-changes.outputs.get-item == 'true' || needs.detect-changes.outputs.update-item == 'true' || needs.detect-changes.outputs.shared == 'true'
    strategy:
      matrix:
        function: [get-item, update-item]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        working-directory: functions/${{ matrix.function }}
        run: |
          echo "📦 Installing Node.js dependencies..."
          npm ci --only=production
          
          # Install dev dependencies for testing
          npm ci
      
      - name: Run security audit
        working-directory: functions/${{ matrix.function }}
        run: |
          echo "🔒 Running npm security audit..."
          
          # Run audit and capture output
          npm audit --audit-level=high --json > audit-report.json || true
          
          # Check for high/critical vulnerabilities
          HIGH_VULNS=$(jq '.metadata.vulnerabilities.high // 0' audit-report.json)
          CRITICAL_VULNS=$(jq '.metadata.vulnerabilities.critical // 0' audit-report.json)
          
          if [ "$HIGH_VULNS" -gt 0 ] || [ "$CRITICAL_VULNS" -gt 0 ]; then
            echo "❌ Found $HIGH_VULNS high and $CRITICAL_VULNS critical vulnerabilities"
            npm audit --audit-level=high
            exit 1
          fi
          
          echo "✅ npm security audit passed"
      
      - name: Run linting
        working-directory: functions/${{ matrix.function }}
        run: |
          echo "🔍 Running ESLint..."
          npm run lint
          echo "✅ Linting passed"
      
      - name: Run tests with coverage
        working-directory: functions/${{ matrix.function }}
        run: |
          echo "🧪 Running Node.js tests..."
          npm run test:coverage
          
          # Check coverage from Jest output
          COVERAGE_FILE="coverage/coverage-summary.json"
          if [ -f "$COVERAGE_FILE" ]; then
            COVERAGE=$(jq '.total.lines.pct' "$COVERAGE_FILE")
            echo "Test coverage: $COVERAGE%"
            
            if (( $(echo "$COVERAGE < 80" | bc -l) )); then
              echo "❌ Test coverage ($COVERAGE%) is below 80% threshold"
              exit 1
            fi
          fi
          
          echo "✅ Node.js tests passed"
      
      - name: Create deployment package
        working-directory: functions/${{ matrix.function }}
        run: |
          echo "📦 Creating deployment package..."
          
          # Remove dev dependencies and create clean package
          rm -rf node_modules
          npm ci --only=production
          
          # Verify package structure
          if [ ! -f "index.js" ]; then
            echo "❌ Missing index.js file"
            exit 1
          fi
          
          if [ ! -f "package.json" ]; then
            echo "❌ Missing package.json file"
            exit 1
          fi
          
          echo "✅ Node.js deployment package ready"
      
      - name: Upload Node.js artifacts
        uses: actions/upload-artifact@v3
        with:
          name: node-function-${{ matrix.function }}
          path: functions/${{ matrix.function }}/
          retention-days: 1

  # Deploy to development environment with OIDC
  deploy-dev:
    runs-on: ubuntu-latest
    needs: [verify-oidc-auth, detect-changes, build-go-functions, build-node-functions]
    if: |
      always() && 
      needs.verify-oidc-auth.result == 'success' &&
      needs.detect-changes.outputs.any-changes == 'true' &&
      (github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch') &&
      (needs.build-go-functions.result == 'success' || needs.build-go-functions.result == 'skipped') &&
      (needs.build-node-functions.result == 'success' || needs.build-node-functions.result == 'skipped')
    environment: development
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOYMENT_ROLE_ARN }}
          role-session-name: GitHubActions-Deploy-Dev-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 3600
      
      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts/
      
      - name: Restore build artifacts
        run: |
          echo "📥 Restoring build artifacts..."
          
          # Restore Go function binaries
          if [ -d "artifacts/go-function-create-item" ]; then
            cp artifacts/go-function-create-item/bootstrap functions/create-item/
            chmod +x functions/create-item/bootstrap
          fi
          
          if [ -d "artifacts/go-function-delete-item" ]; then
            cp artifacts/go-function-delete-item/bootstrap functions/delete-item/
            chmod +x functions/delete-item/bootstrap
          fi
          
          echo "✅ Build artifacts restored"
      
      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@v2
      
      - name: Deploy to development with OIDC
        run: |
          echo "🚀 Deploying to development environment..."
          
          cd infrastructure
          chmod +x scripts/deploy.sh
          
          # Deploy using OIDC credentials (no AWS keys needed)
          ./scripts/deploy.sh --stage dev --region ${{ env.AWS_REGION }}
          
          echo "✅ Development deployment completed"
      
      - name: Verify deployment
        run: |
          echo "🔍 Verifying deployment..."
          
          # Get API URL from CloudFormation stack
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name serverless-crud-api-dev-api \
            --query 'Stacks[0].Outputs[?OutputKey==`ApiUrl`].OutputValue' \
            --output text 2>/dev/null || echo "")
          
          if [ -z "$API_URL" ]; then
            echo "❌ Failed to get API URL from deployment"
            exit 1
          fi
          
          echo "API URL: $API_URL"
          
          # Basic health check
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$API_URL/items/health" || echo "000")
          echo "Health check status: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "404" ]; then
            echo "⚠️ API may not be fully ready (status: $HTTP_STATUS)"
          else
            echo "✅ Deployment verification successful"
          fi

  # Deploy to staging environment with OIDC (main branch only)
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [verify-oidc-auth, detect-changes, build-go-functions, build-node-functions]
    if: |
      always() && 
      needs.verify-oidc-auth.result == 'success' &&
      needs.detect-changes.outputs.any-changes == 'true' &&
      github.ref == 'refs/heads/main' &&
      (needs.build-go-functions.result == 'success' || needs.build-go-functions.result == 'skipped') &&
      (needs.build-node-functions.result == 'success' || needs.build-node-functions.result == 'skipped')
    environment: staging
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOYMENT_ROLE_ARN }}
          role-session-name: GitHubActions-Deploy-Staging-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 3600
      
      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts/
      
      - name: Restore build artifacts
        run: |
          echo "📥 Restoring build artifacts..."
          
          # Restore Go function binaries
          if [ -d "artifacts/go-function-create-item" ]; then
            cp artifacts/go-function-create-item/bootstrap functions/create-item/
            chmod +x functions/create-item/bootstrap
          fi
          
          if [ -d "artifacts/go-function-delete-item" ]; then
            cp artifacts/go-function-delete-item/bootstrap functions/delete-item/
            chmod +x functions/delete-item/bootstrap
          fi
          
          echo "✅ Build artifacts restored"
      
      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@v2
      
      - name: Deploy to staging with OIDC
        run: |
          echo "🚀 Deploying to staging environment..."
          
          cd infrastructure
          chmod +x scripts/deploy.sh
          
          # Deploy using OIDC credentials
          ./scripts/deploy.sh --stage staging --region ${{ env.AWS_REGION }}
          
          echo "✅ Staging deployment completed"

  # Deploy to production with manual approval and OIDC
  deploy-production:
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: needs.deploy-staging.result == 'success' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOYMENT_ROLE_ARN }}
          role-session-name: GitHubActions-Deploy-Prod-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 3600
      
      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts/
      
      - name: Restore build artifacts
        run: |
          echo "📥 Restoring build artifacts..."
          
          # Restore Go function binaries
          if [ -d "artifacts/go-function-create-item" ]; then
            cp artifacts/go-function-create-item/bootstrap functions/create-item/
            chmod +x functions/create-item/bootstrap
          fi
          
          if [ -d "artifacts/go-function-delete-item" ]; then
            cp artifacts/go-function-delete-item/bootstrap functions/delete-item/
            chmod +x functions/delete-item/bootstrap
          fi
          
          echo "✅ Build artifacts restored"
      
      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@v2
      
      - name: Deploy to production with OIDC
        run: |
          echo "🚀 Deploying to production environment..."
          
          cd infrastructure
          chmod +x scripts/deploy.sh
          
          # Deploy using OIDC credentials
          ./scripts/deploy.sh --stage prod --region ${{ env.AWS_REGION }}
          
          echo "✅ Production deployment completed"
      
      - name: Create deployment summary
        run: |
          echo "## 🎉 Production Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: Production" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment time**: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "- **Authentication**: OIDC (No stored AWS credentials)" >> $GITHUB_STEP_SUMMARY

  # Rollback procedure in case of deployment failure
  rollback-on-failure:
    runs-on: ubuntu-latest
    needs: [deploy-dev, deploy-staging, deploy-production]
    if: failure() && (needs.deploy-dev.result == 'failure' || needs.deploy-staging.result == 'failure' || needs.deploy-production.result == 'failure')
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOYMENT_ROLE_ARN }}
          role-session-name: GitHubActions-Rollback-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 3600
      
      - name: Determine rollback environment
        id: rollback-env
        run: |
          if [[ "${{ needs.deploy-production.result }}" == "failure" ]]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.deploy-staging.result }}" == "failure" ]]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.deploy-dev.result }}" == "failure" ]]; then
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi
      
      - name: Rollback deployment
        run: |
          ENV="${{ steps.rollback-env.outputs.environment }}"
          echo "🔄 Rolling back $ENV environment deployment..."
          
          # Get the previous successful deployment
          STACK_NAME="serverless-crud-api-$ENV-api"
          
          # Check if stack exists and get its status
          STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query 'Stacks[0].StackStatus' \
            --output text 2>/dev/null || echo "NOT_FOUND")
          
          echo "Stack status: $STACK_STATUS"
          
          if [[ "$STACK_STATUS" == "ROLLBACK_COMPLETE" ]] || [[ "$STACK_STATUS" == "UPDATE_ROLLBACK_COMPLETE" ]]; then
            echo "✅ Stack already rolled back automatically"
          elif [[ "$STACK_STATUS" == "UPDATE_FAILED" ]]; then
            echo "🔄 Initiating manual rollback..."
            aws cloudformation cancel-update-stack --stack-name "$STACK_NAME" || true
            sleep 30
            aws cloudformation continue-update-rollback --stack-name "$STACK_NAME" || true
          else
            echo "ℹ️ No rollback needed for status: $STACK_STATUS"
          fi
          
          echo "🔄 Rollback procedure completed"