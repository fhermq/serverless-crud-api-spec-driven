name: Deploy Lambda Functions

on:
  push:
    branches: [main, develop]
    paths:
      - 'functions/**'
      - 'shared/**'
      - 'infrastructure/**'
      - '.github/workflows/deploy-functions.yml'
  pull_request:
    branches: [main]
    paths:
      - 'functions/**'
      - 'shared/**'
      - 'infrastructure/**'

env:
  AWS_REGION: us-east-1
  GO_VERSION: '1.21'
  NODE_VERSION: '20'

jobs:
  # Detect changes to determine which functions to build/test
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      create-item: ${{ steps.changes.outputs.create-item }}
      get-item: ${{ steps.changes.outputs.get-item }}
      update-item: ${{ steps.changes.outputs.update-item }}
      delete-item: ${{ steps.changes.outputs.delete-item }}
      shared: ${{ steps.changes.outputs.shared }}
      infrastructure: ${{ steps.changes.outputs.infrastructure }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            create-item:
              - 'functions/create-item/**'
            get-item:
              - 'functions/get-item/**'
            update-item:
              - 'functions/update-item/**'
            delete-item:
              - 'functions/delete-item/**'
            shared:
              - 'shared/**'
            infrastructure:
              - 'infrastructure/**'

  # Test and build Go functions
  test-go-functions:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.create-item == 'true' || needs.detect-changes.outputs.delete-item == 'true' || needs.detect-changes.outputs.shared == 'true'
    strategy:
      matrix:
        function: [create-item, delete-item]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
      
      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('functions/${{ matrix.function }}/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      
      - name: Install dependencies
        working-directory: functions/${{ matrix.function }}
        run: go mod tidy
      
      - name: Run tests
        working-directory: functions/${{ matrix.function }}
        run: go test -v -race -coverprofile=coverage.out ./...
      
      - name: Run linting
        working-directory: functions/${{ matrix.function }}
        run: |
          go vet ./...
          gofmt -s -w .
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go code is not formatted properly"
            exit 1
          fi
      
      - name: Build function
        working-directory: functions/${{ matrix.function }}
        run: |
          GOOS=linux GOARCH=amd64 go build -o main main.go
          ls -la main
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: functions/${{ matrix.function }}/coverage.out
          flags: ${{ matrix.function }}

  # Test and build Node.js functions
  test-node-functions:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.get-item == 'true' || needs.detect-changes.outputs.update-item == 'true' || needs.detect-changes.outputs.shared == 'true'
    strategy:
      matrix:
        function: [get-item, update-item]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: functions/${{ matrix.function }}/package-lock.json
      
      - name: Install dependencies
        working-directory: functions/${{ matrix.function }}
        run: npm ci
      
      - name: Run linting
        working-directory: functions/${{ matrix.function }}
        run: npm run lint
      
      - name: Run tests
        working-directory: functions/${{ matrix.function }}
        run: npm run test:coverage
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: functions/${{ matrix.function }}/coverage/lcov.info
          flags: ${{ matrix.function }}

  # Deploy to development environment
  deploy-dev:
    runs-on: ubuntu-latest
    needs: [detect-changes, test-go-functions, test-node-functions]
    if: github.ref == 'refs/heads/develop' && (needs.detect-changes.outputs.create-item == 'true' || needs.detect-changes.outputs.get-item == 'true' || needs.detect-changes.outputs.update-item == 'true' || needs.detect-changes.outputs.delete-item == 'true' || needs.detect-changes.outputs.shared == 'true' || needs.detect-changes.outputs.infrastructure == 'true')
    environment: development
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@v2
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Deploy to development
        run: |
          chmod +x infrastructure/scripts/deploy.sh
          infrastructure/scripts/deploy.sh --stage dev --region ${{ env.AWS_REGION }}

  # Deploy to staging environment
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [detect-changes, test-go-functions, test-node-functions]
    if: github.ref == 'refs/heads/main' && (needs.detect-changes.outputs.create-item == 'true' || needs.detect-changes.outputs.get-item == 'true' || needs.detect-changes.outputs.update-item == 'true' || needs.detect-changes.outputs.delete-item == 'true' || needs.detect-changes.outputs.shared == 'true' || needs.detect-changes.outputs.infrastructure == 'true')
    environment: staging
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@v2
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Deploy to staging
        run: |
          chmod +x infrastructure/scripts/deploy.sh
          infrastructure/scripts/deploy.sh --stage staging --region ${{ env.AWS_REGION }}

  # Deploy to production (manual approval required)
  deploy-production:
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@v2
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Deploy to production
        run: |
          chmod +x infrastructure/scripts/deploy.sh
          infrastructure/scripts/deploy.sh --stage prod --region ${{ env.AWS_REGION }}