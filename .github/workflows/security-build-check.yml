name: Security Build Checks

on:
  push:
    branches: [main, develop, 'feature/**']
    paths:
      - 'functions/**'
      - 'shared/**'
      - 'package*.json'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    branches: [main, develop]
    paths:
      - 'functions/**'
      - 'shared/**'
      - 'package*.json'
      - 'go.mod'
      - 'go.sum'
  schedule:
    # Run security checks daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  GO_VERSION: '1.21'
  NODE_VERSION: '20'

jobs:
  # Detect which functions have changed
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      go-functions: ${{ steps.detect.outputs.go-functions }}
      node-functions: ${{ steps.detect.outputs.node-functions }}
      any-functions: ${{ steps.detect.outputs.any-functions }}
      shared-changed: ${{ steps.detect.outputs.shared-changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Detect changed functions
        id: detect
        run: |
          echo "🔍 Detecting changed functions..."
          
          # Initialize arrays
          go_functions=""
          node_functions=""
          any_functions="false"
          shared_changed="false"
          
          # Check if this is a scheduled run or manual dispatch
          if [[ "${{ github.event_name }}" == "schedule" ]] || [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Running full security scan (scheduled/manual)"
            go_functions="create-item delete-item"
            node_functions="get-item update-item"
            any_functions="true"
            shared_changed="true"
          else
            # Check for changes in specific function directories
            for func_dir in functions/*/; do
              func_name=$(basename "$func_dir")
              
              if git diff --name-only HEAD~1 HEAD | grep -q "^functions/$func_name/"; then
                any_functions="true"
                
                if [ -f "$func_dir/go.mod" ]; then
                  go_functions="$go_functions $func_name"
                elif [ -f "$func_dir/package.json" ]; then
                  node_functions="$node_functions $func_name"
                fi
              fi
            done
            
            # Check for shared changes
            if git diff --name-only HEAD~1 HEAD | grep -q "^shared/"; then
              shared_changed="true"
              any_functions="true"
              # If shared changed, check all functions
              go_functions="create-item delete-item"
              node_functions="get-item update-item"
            fi
          fi
          
          # Trim whitespace
          go_functions=$(echo "$go_functions" | xargs)
          node_functions=$(echo "$node_functions" | xargs)
          
          echo "Go functions to check: $go_functions"
          echo "Node.js functions to check: $node_functions"
          echo "Any functions changed: $any_functions"
          echo "Shared changed: $shared_changed"
          
          echo "go-functions=$go_functions" >> $GITHUB_OUTPUT
          echo "node-functions=$node_functions" >> $GITHUB_OUTPUT
          echo "any-functions=$any_functions" >> $GITHUB_OUTPUT
          echo "shared-changed=$shared_changed" >> $GITHUB_OUTPUT

  # Comprehensive security scan for Go functions
  security-scan-go:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.go-functions != ''
    strategy:
      matrix:
        function: ${{ fromJson(format('["{0}"]', join(fromJson(format('[{0}]', needs.detect-changes.outputs.go-functions)), '","'))) }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
      
      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-security-${{ hashFiles('functions/${{ matrix.function }}/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-security-
            ${{ runner.os }}-go-
      
      - name: Install security tools
        run: |
          echo "🔧 Installing Go security tools..."
          go install github.com/securecodewarrior/gosec/v2/cmd/gosec@latest
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
          echo "✅ Security tools installed"
      
      - name: Install function dependencies
        working-directory: functions/${{ matrix.function }}
        run: |
          echo "📦 Installing Go dependencies for ${{ matrix.function }}..."
          go mod download
          go mod tidy
      
      - name: Run vulnerability check
        working-directory: functions/${{ matrix.function }}
        run: |
          echo "🔍 Running Go vulnerability check for ${{ matrix.function }}..."
          govulncheck ./... || {
            echo "❌ Vulnerabilities found in Go dependencies"
            exit 1
          }
          echo "✅ No known vulnerabilities found"
      
      - name: Run gosec security scan
        working-directory: functions/${{ matrix.function }}
        run: |
          echo "🔒 Running gosec security scan for ${{ matrix.function }}..."
          
          # Run gosec and save results
          gosec -fmt json -out gosec-report.json ./... || true
          
          # Display results
          gosec -fmt text ./... || true
          
          # Check for critical/high severity issues
          if [ -f gosec-report.json ]; then
            CRITICAL_ISSUES=$(jq '.Issues | map(select(.severity == "CRITICAL")) | length' gosec-report.json)
            HIGH_ISSUES=$(jq '.Issues | map(select(.severity == "HIGH")) | length' gosec-report.json)
            
            echo "Critical issues: $CRITICAL_ISSUES"
            echo "High severity issues: $HIGH_ISSUES"
            
            if [ "$CRITICAL_ISSUES" -gt 0 ]; then
              echo "❌ Found $CRITICAL_ISSUES critical security issues"
              jq '.Issues | map(select(.severity == "CRITICAL"))' gosec-report.json
              exit 1
            fi
            
            if [ "$HIGH_ISSUES" -gt 0 ]; then
              echo "⚠️ Found $HIGH_ISSUES high severity security issues"
              jq '.Issues | map(select(.severity == "HIGH"))' gosec-report.json
              # Don't fail on high severity, but warn
            fi
          fi
          
          echo "✅ gosec security scan completed"
      
      - name: Run static analysis
        working-directory: functions/${{ matrix.function }}
        run: |
          echo "🔍 Running static analysis for ${{ matrix.function }}..."
          
          # Run go vet
          go vet ./...
          
          # Run staticcheck
          staticcheck ./...
          
          echo "✅ Static analysis passed"
      
      - name: Check for hardcoded secrets
        working-directory: functions/${{ matrix.function }}
        run: |
          echo "🔍 Checking for hardcoded secrets in ${{ matrix.function }}..."
          
          # Check for common secret patterns
          SECRET_PATTERNS=(
            "aws_access_key_id"
            "aws_secret_access_key"
            "password.*="
            "token.*="
            "api_key.*="
            "secret.*="
            "AKIA[0-9A-Z]{16}"  # AWS Access Key pattern
          )
          
          SECRETS_FOUND=false
          
          for pattern in "${SECRET_PATTERNS[@]}"; do
            if grep -r -i "$pattern" . --exclude-dir=.git --exclude="*.test.go" --exclude="*.md"; then
              echo "❌ Potential secret found: $pattern"
              SECRETS_FOUND=true
            fi
          done
          
          if [ "$SECRETS_FOUND" = true ]; then
            echo "❌ Hardcoded secrets detected"
            exit 1
          fi
          
          echo "✅ No hardcoded secrets found"
      
      - name: Build and test with security flags
        working-directory: functions/${{ matrix.function }}
        run: |
          echo "🔨 Building ${{ matrix.function }} with security flags..."
          
          # Build with security-focused flags
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags="-s -w -extldflags '-static'" \
            -a -installsuffix cgo \
            -o bootstrap main.go logger.go
          
          # Verify binary
          if [ ! -f bootstrap ]; then
            echo "❌ Failed to build binary"
            exit 1
          fi
          
          # Check binary properties
          file bootstrap
          ls -la bootstrap
          
          # Run tests with race detection
          go test -race -v ./...
          
          echo "✅ Build and test completed successfully"
      
      - name: Upload security scan results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: go-security-scan-${{ matrix.function }}
          path: functions/${{ matrix.function }}/gosec-report.json
          retention-days: 7

  # Comprehensive security scan for Node.js functions
  security-scan-node:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.node-functions != ''
    strategy:
      matrix:
        function: ${{ fromJson(format('["{0}"]', join(fromJson(format('[{0}]', needs.detect-changes.outputs.node-functions)), '","'))) }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install function dependencies
        working-directory: functions/${{ matrix.function }}
        run: |
          echo "📦 Installing Node.js dependencies for ${{ matrix.function }}..."
          npm ci
      
      - name: Run npm security audit
        working-directory: functions/${{ matrix.function }}
        run: |
          echo "🔒 Running npm security audit for ${{ matrix.function }}..."
          
          # Run audit and save results
          npm audit --json > npm-audit-report.json || true
          
          # Display human-readable results
          npm audit || true
          
          # Check for critical/high vulnerabilities
          if [ -f npm-audit-report.json ]; then
            CRITICAL_VULNS=$(jq '.metadata.vulnerabilities.critical // 0' npm-audit-report.json)
            HIGH_VULNS=$(jq '.metadata.vulnerabilities.high // 0' npm-audit-report.json)
            
            echo "Critical vulnerabilities: $CRITICAL_VULNS"
            echo "High vulnerabilities: $HIGH_VULNS"
            
            if [ "$CRITICAL_VULNS" -gt 0 ]; then
              echo "❌ Found $CRITICAL_VULNS critical vulnerabilities"
              npm audit --audit-level=critical
              exit 1
            fi
            
            if [ "$HIGH_VULNS" -gt 0 ]; then
              echo "⚠️ Found $HIGH_VULNS high severity vulnerabilities"
              npm audit --audit-level=high
              # Don't fail on high severity, but warn
            fi
          fi
          
          echo "✅ npm security audit completed"
      
      - name: Install and run ESLint security plugin
        working-directory: functions/${{ matrix.function }}
        run: |
          echo "🔍 Running ESLint security checks for ${{ matrix.function }}..."
          
          # Install security-focused ESLint plugins
          npm install --no-save eslint-plugin-security eslint-plugin-node
          
          # Create temporary ESLint config with security rules
          cat > .eslintrc.security.js << 'EOF'
          module.exports = {
            extends: [
              'eslint:recommended',
              'plugin:security/recommended',
              'plugin:node/recommended'
            ],
            plugins: ['security', 'node'],
            env: {
              node: true,
              es2022: true
            },
            parserOptions: {
              ecmaVersion: 2022
            },
            rules: {
              'security/detect-object-injection': 'error',
              'security/detect-non-literal-regexp': 'error',
              'security/detect-unsafe-regex': 'error',
              'security/detect-buffer-noassert': 'error',
              'security/detect-child-process': 'error',
              'security/detect-disable-mustache-escape': 'error',
              'security/detect-eval-with-expression': 'error',
              'security/detect-no-csrf-before-method-override': 'error',
              'security/detect-non-literal-fs-filename': 'error',
              'security/detect-non-literal-require': 'error',
              'security/detect-possible-timing-attacks': 'error',
              'security/detect-pseudoRandomBytes': 'error'
            }
          };
          EOF
          
          # Run security-focused linting
          npx eslint --config .eslintrc.security.js *.js || {
            echo "❌ Security linting failed"
            exit 1
          }
          
          echo "✅ ESLint security checks passed"
      
      - name: Check for hardcoded secrets
        working-directory: functions/${{ matrix.function }}
        run: |
          echo "🔍 Checking for hardcoded secrets in ${{ matrix.function }}..."
          
          # Check for common secret patterns in JavaScript
          SECRET_PATTERNS=(
            "aws_access_key_id"
            "aws_secret_access_key"
            "password.*[=:]"
            "token.*[=:]"
            "api_key.*[=:]"
            "secret.*[=:]"
            "AKIA[0-9A-Z]{16}"  # AWS Access Key pattern
            "mongodb://.*:.*@"   # MongoDB connection string
            "mysql://.*:.*@"     # MySQL connection string
          )
          
          SECRETS_FOUND=false
          
          for pattern in "${SECRET_PATTERNS[@]}"; do
            if grep -r -i "$pattern" . --exclude-dir=node_modules --exclude="*.test.js" --exclude="*.md"; then
              echo "❌ Potential secret found: $pattern"
              SECRETS_FOUND=true
            fi
          done
          
          if [ "$SECRETS_FOUND" = true ]; then
            echo "❌ Hardcoded secrets detected"
            exit 1
          fi
          
          echo "✅ No hardcoded secrets found"
      
      - name: Run dependency license check
        working-directory: functions/${{ matrix.function }}
        run: |
          echo "📄 Checking dependency licenses for ${{ matrix.function }}..."
          
          # Install license checker
          npm install --no-save license-checker
          
          # Check for problematic licenses
          npx license-checker --onlyAllow 'MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;0BSD;Unlicense' || {
            echo "⚠️ Some dependencies have restrictive licenses"
            npx license-checker --summary
            # Don't fail on license issues, but warn
          }
          
          echo "✅ License check completed"
      
      - name: Build and test with security focus
        working-directory: functions/${{ matrix.function }}
        run: |
          echo "🧪 Running tests with security focus for ${{ matrix.function }}..."
          
          # Run tests with coverage
          npm run test:coverage
          
          # Check for test coverage
          if [ -f "coverage/coverage-summary.json" ]; then
            COVERAGE=$(jq '.total.lines.pct' coverage/coverage-summary.json)
            echo "Test coverage: $COVERAGE%"
            
            if (( $(echo "$COVERAGE < 80" | bc -l) )); then
              echo "❌ Test coverage ($COVERAGE%) is below 80% threshold"
              exit 1
            fi
          fi
          
          # Create production build
          rm -rf node_modules
          npm ci --only=production
          
          # Verify no dev dependencies in production build
          if npm ls --depth=0 --only=dev 2>/dev/null | grep -v "empty"; then
            echo "❌ Dev dependencies found in production build"
            exit 1
          fi
          
          echo "✅ Build and test completed successfully"
      
      - name: Upload security scan results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: node-security-scan-${{ matrix.function }}
          path: functions/${{ matrix.function }}/npm-audit-report.json
          retention-days: 7

  # Container security scan
  container-security-scan:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.any-functions == 'true'
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
      
      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
      
      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'

  # Generate security report
  security-report:
    runs-on: ubuntu-latest
    needs: [detect-changes, security-scan-go, security-scan-node, container-security-scan]
    if: always() && needs.detect-changes.outputs.any-functions == 'true'
    steps:
      - uses: actions/checkout@v4
      
      - name: Download security scan results
        uses: actions/download-artifact@v3
        with:
          path: security-results/
      
      - name: Generate security summary
        run: |
          echo "# 🔒 Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Scan Date:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Go functions summary
          if [ -n "${{ needs.detect-changes.outputs.go-functions }}" ]; then
            echo "## Go Functions Scanned" >> $GITHUB_STEP_SUMMARY
            for func in ${{ needs.detect-changes.outputs.go-functions }}; do
              echo "- ✅ $func" >> $GITHUB_STEP_SUMMARY
            done
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Node.js functions summary
          if [ -n "${{ needs.detect-changes.outputs.node-functions }}" ]; then
            echo "## Node.js Functions Scanned" >> $GITHUB_STEP_SUMMARY
            for func in ${{ needs.detect-changes.outputs.node-functions }}; do
              echo "- ✅ $func" >> $GITHUB_STEP_SUMMARY
            done
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Security checks performed
          echo "## Security Checks Performed" >> $GITHUB_STEP_SUMMARY
          echo "- 🔍 Vulnerability scanning (govulncheck, npm audit)" >> $GITHUB_STEP_SUMMARY
          echo "- 🔒 Static security analysis (gosec, ESLint security)" >> $GITHUB_STEP_SUMMARY
          echo "- 🕵️ Hardcoded secrets detection" >> $GITHUB_STEP_SUMMARY
          echo "- 📄 License compliance check" >> $GITHUB_STEP_SUMMARY
          echo "- 🐳 Container security scan (Trivy)" >> $GITHUB_STEP_SUMMARY
          echo "- 🧪 Test coverage validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Results summary
          echo "## Results" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ needs.security-scan-go.result }}" == "success" ]] || [[ "${{ needs.security-scan-go.result }}" == "skipped" ]]; then
            echo "- ✅ Go security scans: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ Go security scans: FAILED" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [[ "${{ needs.security-scan-node.result }}" == "success" ]] || [[ "${{ needs.security-scan-node.result }}" == "skipped" ]]; then
            echo "- ✅ Node.js security scans: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ Node.js security scans: FAILED" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [[ "${{ needs.container-security-scan.result }}" == "success" ]]; then
            echo "- ✅ Container security scan: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ Container security scan: FAILED" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "For detailed results, check the individual job logs and uploaded artifacts." >> $GITHUB_STEP_SUMMARY

  # Security gate - fail if critical issues found
  security-gate:
    runs-on: ubuntu-latest
    needs: [security-scan-go, security-scan-node, container-security-scan]
    if: always()
    steps:
      - name: Evaluate security gate
        run: |
          echo "🚪 Evaluating security gate..."
          
          GATE_PASSED=true
          
          # Check Go security results
          if [[ "${{ needs.security-scan-go.result }}" == "failure" ]]; then
            echo "❌ Go security scan failed"
            GATE_PASSED=false
          fi
          
          # Check Node.js security results
          if [[ "${{ needs.security-scan-node.result }}" == "failure" ]]; then
            echo "❌ Node.js security scan failed"
            GATE_PASSED=false
          fi
          
          # Check container security results
          if [[ "${{ needs.container-security-scan.result }}" == "failure" ]]; then
            echo "❌ Container security scan failed"
            GATE_PASSED=false
          fi
          
          if [ "$GATE_PASSED" = true ]; then
            echo "✅ Security gate PASSED - All security checks successful"
          else
            echo "❌ Security gate FAILED - Critical security issues found"
            exit 1
          fi