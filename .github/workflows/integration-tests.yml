name: Integration Tests

on:
  workflow_run:
    workflows: ["Deploy Lambda Functions"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  AWS_REGION: us-east-1
  NODE_VERSION: '20'

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    strategy:
      matrix:
        environment: [dev, staging]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Get API Gateway URL
        id: get-api-url
        run: |
          STACK_NAME="serverless-crud-api-${{ matrix.environment }}"
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name $STACK_NAME \
            --query 'Stacks[0].Outputs[?OutputKey==`ApiUrl`].OutputValue' \
            --output text)
          echo "api_url=$API_URL" >> $GITHUB_OUTPUT
          echo "API URL: $API_URL"
      
      - name: Install test dependencies
        run: |
          npm install -g newman
          npm install -g @apidevtools/swagger-parser
      
      - name: Run API health check
        run: |
          API_URL="${{ steps.get-api-url.outputs.api_url }}"
          echo "Testing API health at: $API_URL"
          
          # Test API Gateway is responding
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$API_URL/items/health" || echo "000")
          echo "Health check status: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "404" ]; then
            echo "API Gateway is not responding properly"
            exit 1
          fi
      
      - name: Run CRUD operation tests
        run: |
          API_URL="${{ steps.get-api-url.outputs.api_url }}"
          
          # Test data
          TEST_ITEM='{"name":"Test Item","description":"Integration test item","category":"electronics","price":99.99}'
          
          echo "🧪 Running CRUD integration tests..."
          
          # Test 1: Create item (POST /items)
          echo "📝 Testing CREATE operation..."
          CREATE_RESPONSE=$(curl -s -X POST \
            -H "Content-Type: application/json" \
            -d "$TEST_ITEM" \
            "$API_URL/items")
          
          echo "Create response: $CREATE_RESPONSE"
          
          # Extract item ID from response (assuming JSON response with id field)
          ITEM_ID=$(echo "$CREATE_RESPONSE" | grep -o '"id":"[^"]*"' | cut -d'"' -f4 || echo "")
          
          if [ -z "$ITEM_ID" ]; then
            echo "❌ Failed to create item or extract ID"
            echo "Response: $CREATE_RESPONSE"
            # Don't exit here, continue with other tests
          else
            echo "✅ Item created with ID: $ITEM_ID"
            
            # Test 2: Get item (GET /items/{id})
            echo "📖 Testing READ operation..."
            GET_RESPONSE=$(curl -s "$API_URL/items/$ITEM_ID")
            echo "Get response: $GET_RESPONSE"
            
            # Test 3: Update item (PUT /items/{id})
            echo "✏️ Testing UPDATE operation..."
            UPDATE_DATA='{"name":"Updated Test Item","price":149.99}'
            UPDATE_RESPONSE=$(curl -s -X PUT \
              -H "Content-Type: application/json" \
              -d "$UPDATE_DATA" \
              "$API_URL/items/$ITEM_ID")
            echo "Update response: $UPDATE_RESPONSE"
            
            # Test 4: Delete item (DELETE /items/{id})
            echo "🗑️ Testing DELETE operation..."
            DELETE_RESPONSE=$(curl -s -X DELETE "$API_URL/items/$ITEM_ID")
            echo "Delete response: $DELETE_RESPONSE"
            
            # Test 5: Verify item is deleted (GET /items/{id} should return 404)
            echo "🔍 Verifying item deletion..."
            VERIFY_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$API_URL/items/$ITEM_ID")
            echo "Verification status: $VERIFY_STATUS"
            
            if [ "$VERIFY_STATUS" = "404" ]; then
              echo "✅ Item successfully deleted"
            else
              echo "⚠️ Item may not have been deleted properly (status: $VERIFY_STATUS)"
            fi
          fi
      
      - name: Test error handling
        run: |
          API_URL="${{ steps.get-api-url.outputs.api_url }}"
          
          echo "🧪 Testing error handling..."
          
          # Test 1: Get non-existent item (should return 404)
          echo "Testing 404 error..."
          NOT_FOUND_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$API_URL/items/non-existent-id")
          echo "Non-existent item status: $NOT_FOUND_STATUS"
          
          # Test 2: Create item with invalid data (should return 400)
          echo "Testing validation error..."
          INVALID_DATA='{"name":"","price":-1}'
          VALIDATION_RESPONSE=$(curl -s -X POST \
            -H "Content-Type: application/json" \
            -d "$INVALID_DATA" \
            "$API_URL/items")
          echo "Validation error response: $VALIDATION_RESPONSE"
      
      - name: Performance baseline test
        run: |
          API_URL="${{ steps.get-api-url.outputs.api_url }}"
          
          echo "🚀 Running performance baseline tests..."
          
          # Simple load test - create multiple items concurrently
          for i in {1..5}; do
            TEST_ITEM="{\"name\":\"Load Test Item $i\",\"category\":\"electronics\",\"price\":$((i * 10))}"
            curl -s -X POST \
              -H "Content-Type: application/json" \
              -d "$TEST_ITEM" \
              "$API_URL/items" &
          done
          
          # Wait for all background jobs to complete
          wait
          
          echo "✅ Performance baseline test completed"
      
      - name: Generate test report
        if: always()
        run: |
          echo "## Integration Test Report - ${{ matrix.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ matrix.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **API URL**: ${{ steps.get-api-url.outputs.api_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Test Date**: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

  # Production smoke tests (only basic health checks)
  production-smoke-tests:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Get Production API URL
        id: get-prod-api-url
        run: |
          STACK_NAME="serverless-crud-api-prod"
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name $STACK_NAME \
            --query 'Stacks[0].Outputs[?OutputKey==`ApiUrl`].OutputValue' \
            --output text 2>/dev/null || echo "")
          
          if [ -z "$API_URL" ]; then
            echo "Production stack not found or not deployed yet"
            echo "api_url=" >> $GITHUB_OUTPUT
          else
            echo "api_url=$API_URL" >> $GITHUB_OUTPUT
            echo "Production API URL: $API_URL"
          fi
      
      - name: Run production health checks
        if: steps.get-prod-api-url.outputs.api_url != ''
        run: |
          API_URL="${{ steps.get-prod-api-url.outputs.api_url }}"
          
          echo "🏥 Running production health checks..."
          
          # Basic connectivity test
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$API_URL/items/health" || echo "000")
          echo "Health check status: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "404" ]; then
            echo "❌ Production API health check failed"
            exit 1
          else
            echo "✅ Production API is responding"
          fi